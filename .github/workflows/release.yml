name: Release

# On a version tag (v0.3.0): compiles the Windows client, puts it in the server image (served
# at /download/plume-lite.exe, so updating the server updates the download), tries the image
# as in production (deploy/compose.yaml), then publishes it to GitHub's container registry:
# ghcr.io/donrosio/plume-lite-server:<version>. Run by hand (Actions → Release → Run
# workflow), it builds and tries everything without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a publication halfway.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-client:
    name: Windows client
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked -p plume-lite-client
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plume-lite-windows
          path: target/release/plume-lite.exe
          if-no-files-found: error
          retention-days: 30

  image:
    name: Server image
    needs: windows-client
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # To publish the image. Only used on a version tag (last step).
      packages: write
    env:
      IMAGE: ghcr.io/donrosio/plume-lite-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the version $version of Cargo.toml"
            exit 1
          fi
          echo "PLUME_LITE_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plume-lite-windows
          path: downloads

      - name: Build the image
        run: docker build --tag "$IMAGE:$PLUME_LITE_VERSION" .

      - name: Start it as in production
        working-directory: deploy
        run: |
          echo "PLUME_LITE_VERSION=$PLUME_LITE_VERSION" > .env
          docker compose up --detach --wait

      - name: Try it
        working-directory: deploy
        run: |
          set -x
          curl --fail --silent --show-error http://127.0.0.1:3200/health/ready
          curl --fail --silent --show-error http://127.0.0.1:3200/api/v1/instance | grep --quiet '"download_path":"/download/plume-lite.exe"'
          curl --fail --silent --show-error --output plume-lite.exe http://127.0.0.1:3200/download/plume-lite.exe
          cmp plume-lite.exe ../downloads/plume-lite.exe
          curl --fail --silent --show-error http://127.0.0.1:3200/ | grep --quiet 'Télécharger pour Windows'
          docker compose exec server plume-lite-server invite | grep --quiet "Code d'inscription"
          docker compose exec server plume-lite-server backup | grep --quiet 'Sauvegarde écrite'

      - name: Logs of the container
        if: always()
        working-directory: deploy
        run: docker compose logs --no-color

      - name: Publish the image
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$PLUME_LITE_VERSION"
          docker logout ghcr.io
          echo "Published $IMAGE:$PLUME_LITE_VERSION" >> "$GITHUB_STEP_SUMMARY"
