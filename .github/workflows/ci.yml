name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run (Monday morning), so a vulnerability disclosed in an existing dependency
    # makes the audit fail, and GitHub sends an e-mail, even when nobody pushes.
    - cron: '41 6 * * 1'
  workflow_dispatch:

# Least privilege: the jobs only read the code, and no secret is used.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, tests
    # The weekly run only audits: the code did not change.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # No debug info: with the voice engine, debug binaries take several GB each and filled
      # the runner's disk (the linker died of a bus error). Tests do not need it.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # Every action is pinned to a full commit SHA (the comment gives the tag): a moved or
      # hijacked tag cannot change what runs here. Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The voice engine (libwebrtc, in the client) needs clang 21 or newer and the glib
      # headers; Ubuntu 24.04 ships clang 18, so it comes from LLVM's own packages, whose
      # signing key is checked against its known fingerprint. The join and leave chimes (cpal)
      # need the ALSA headers.
      - name: Install clang 21, the glib and ALSA headers
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o llvm.asc
          gpg --show-keys --with-colons llvm.asc | grep -q '^fpr:::::::::6084F3CF814B57C1CF12EFD515CF4D18AF4F7421:'
          sudo install -D -m 0644 llvm.asc /etc/apt/keyrings/llvm.asc
          echo 'deb [signed-by=/etc/apt/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-21 libglib2.0-dev libasound2-dev
      # The voice engine's build would download a prebuilt libwebrtc without checking it: it is
      # fetched here instead, and must match the SHA-256 pinned in scripts/libwebrtc.json.
      - name: Voice engine (libwebrtc), checked against its pinned SHA-256
        run: |
          dir="$(python3 scripts/fetch_libwebrtc.py linux-x64-release "$RUNNER_TEMP/libwebrtc")"
          echo "LK_CUSTOM_WEBRTC=$dir" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Unit tests + end-to-end tests (real HTTP + WebSocket, a throwaway SQLite file per test).
      - run: cargo test --workspace --locked
      - name: Disk space (when something failed)
        if: failure()
        run: df -h / && du -sh target 2>/dev/null || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-audit
      # Checks Cargo.lock against the RustSec advisories.
      - run: cargo audit

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not only the last one: also catches a secret committed with
          # --no-verify, which skips the local pre-commit hook.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # --redact: workflow logs are readable by anyone with access to the repository.
      - run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner
