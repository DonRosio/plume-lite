# Gitleaks configuration: the built-in ruleset (AWS, GitHub, Stripe, generic API keys…).
# Used by the pre-commit hook (.githooks/pre-commit) and the CI (.github/workflows/ci.yml).
# Docs: https://github.com/gitleaks/gitleaks#configuration

title = "plume-lite"

[extend]
useDefault = true

# The secret key that signs the clients (deploy/README.md): it must never be committed.
[[rules]]
id = "minisign-secret-key"
description = "minisign secret key"
# The comment line (minisign or rsign), or the key itself: base64 of "EdScB2" (encrypted) or
# "Ed\0\0B2" (unencrypted) followed by the key material.
regex = '''untrusted comment: \w+ (?:encrypted |unencrypted )?secret key|RW(?:RTY0Iy|QAAEIy)[A-Za-z0-9+/]{100,}'''
keywords = ["secret key", "RWRTY0Iy", "RWQAAEIy"]
