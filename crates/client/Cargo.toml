[package]
name = "plume-lite-client"
description = "Native Plume Lite desktop client (iced)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "plume-lite"
path = "src/main.rs"

[dependencies]
plume-lite-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
futures-util.workspace = true
iced.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
directories.workspace = true
getrandom.workspace = true
# Voice: LiveKit's client SDK (WebRTC, with the system's microphone and speakers).
livekit = { version = "0.9.4", features = ["rustls-tls-native-roots"] }
# Join and leave chimes: a short output stream of their own (LiveKit's audio module only
# plays the call). Needs the ALSA headers on Linux (libasound2-dev).
cpal = "0.18.2"
# Updates are checked before being kept: SHA-256, then the minisign signature (update.rs).
sha2.workspace = true
minisign-verify = "0.3"
# Only used to pin one TLS crypto backend for both HTTPS (reqwest) and WSS (tungstenite).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
# System notifications: the desktop's notification service over D-Bus (pure Rust) on Linux,
# toasts on Windows.
notify-rust = "4.18"
# The icon in the notification area (tray.rs), drawn from assets/plume-lite.ico.
png = "0.18"

[dev-dependencies]
# tests/voice_call.rs talks to the development server's API.
reqwest.workspace = true
# Signs test data for the update checks (the client itself only verifies).
minisign = "0.10"

# Linux: the notification area over D-Bus (StatusNotifierItem, pure Rust), on the same D-Bus
# library as the notifications.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# Windows: toasts under a registered application name (notify.rs), and the system tray.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
tray-icon = { version = "0.26", default-features = false }

# The icon of plume-lite.exe (build.rs), only when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
